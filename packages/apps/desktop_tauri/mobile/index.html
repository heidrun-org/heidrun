<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Herdr">
<meta name="theme-color" content="#0b0c0e">
<link rel="manifest" href="/manifest.json">
<title>Heidrun</title>
<style>
:root {
  --bg: #0b0c0e; --panel: #121417; --field: #1a1d21; --line: #23272c; --line-strong: #2e3339;
  --text: #e8e6e1; --text-2: #b6b9bd; --muted: #8e949a;
  --working: #3fb8af; --blocked: #f0645f; --question: #c29bf0; --done: #6ea8fe; --ok: #7ec699; --accent: #f2a93b;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--text); }
body { min-height: 100vh; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
.top { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 10px; padding: 12px 16px; background: rgba(11,12,14,.92); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.top h1 { margin: 0; font-size: 17px; font-weight: 650; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.back { font-size: 16px; color: var(--done); padding: 4px 8px 4px 0; }
.conn { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex-shrink: 0; }
.conn.ok { background: var(--working); } .conn.bad { background: var(--blocked); }
main { padding: 12px 16px 120px; max-width: 760px; margin: 0 auto; }
.eyebrow { font-size: 11.5px; font-weight: 650; letter-spacing: .6px; text-transform: uppercase; color: var(--muted); margin: 18px 4px 8px; }
.card { display: block; width: 100%; text-align: left; padding: 12px 14px; margin-bottom: 8px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); }
.card.blocked { border-color: #5c2826; background: #1a1111; }
.card.question { border-color: #4a3a66; background: #16121d; }
.row { display: flex; align-items: center; gap: 8px; }
.name { font-weight: 600; font-size: 15px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sub { font-size: 13px; color: var(--text-2); margin-top: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.q { font-size: 13.5px; color: var(--text); margin-top: 6px; line-height: 1.4; }
.badge { font-size: 11px; font-weight: 650; letter-spacing: .4px; padding: 2px 7px; border-radius: 6px; background: var(--field); color: var(--text-2); flex-shrink: 0; }
.b-blocked { color: var(--blocked); background: #2a1414; } .b-working { color: var(--working); background: #10282a; }
.b-done { color: var(--done); background: #121e30; } .b-question { color: var(--question); background: #221a30; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex-shrink: 0; }
.dot.working { background: var(--working); } .dot.blocked { background: var(--blocked); } .dot.done { background: var(--done); } .dot.idle { background: #5a6066; }
.list .card { padding: 10px 12px; }
.quota { display: flex; gap: 12px; font-size: 12.5px; color: var(--text-2); margin: 4px 4px 0; }
.empty { color: var(--muted); font-size: 14px; padding: 12px 4px; }
.menu { display: flex; flex-direction: column; gap: 8px; margin: 10px 0; }
.opt { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 10px; background: var(--field); border: 1px solid var(--line-strong); text-align: left; font-size: 14.5px; }
.opt .n { font-weight: 700; color: var(--muted); }
.opt.yes { border-color: #2c5a3a; } .opt.no { border-color: #5c2826; }
.detail { font-family: ui-monospace, Menlo, monospace; font-size: 12.5px; white-space: pre-wrap; word-break: break-word; background: #170f0f; border-radius: 8px; padding: 8px 10px; color: var(--text-2); }
pre.out { font-family: ui-monospace, Menlo, monospace; font-size: 11.5px; line-height: 1.45; white-space: pre-wrap; word-break: break-word; background: #08090a; border: 1px solid var(--line); border-radius: 10px; padding: 10px; max-height: 52vh; overflow: auto; margin: 10px 0; color: var(--text-2); }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { padding: 10px 14px; border-radius: 10px; background: var(--field); border: 1px solid var(--line-strong); font-size: 14px; }
.btn.primary { background: var(--done); color: #08111f; border-color: transparent; font-weight: 650; }
.btn.danger { color: var(--blocked); }
.composer { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; display: flex; gap: 8px; padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); background: rgba(18,20,23,.96); backdrop-filter: blur(10px); border-top: 1px solid var(--line); }
.composer textarea { flex: 1; min-height: 42px; max-height: 140px; resize: none; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line-strong); background: var(--field); color: var(--text); font: inherit; font-size: 16px; }
.toast { position: fixed; left: 50%; bottom: calc(80px + env(safe-area-inset-bottom)); transform: translateX(-50%); padding: 10px 14px; border-radius: 10px; background: #23272c; border: 1px solid var(--line-strong); font-size: 13.5px; max-width: 90vw; z-index: 20; }
.sheet { position: fixed; inset: 0; z-index: 30; background: rgba(0,0,0,.6); display: flex; align-items: flex-end; }
.sheet .box { width: 100%; padding: 18px 16px calc(18px + env(safe-area-inset-bottom)); border-radius: 16px 16px 0 0; background: var(--panel); border-top: 1px solid var(--line-strong); }
.sheet h2 { margin: 0 0 6px; font-size: 17px; }
.sheet p { margin: 0 0 10px; color: var(--text-2); font-size: 14px; }
.pairing { text-align: center; padding: 60px 24px; color: var(--text-2); line-height: 1.5; }
.pairing h2 { color: var(--text); }
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";
// ---- Pairing: the token comes in the QR code's link, after "#" (never sent to a server).
(function () {
  const m = /[#&]t=([0-9a-f]{64})/.exec(location.hash);
  if (m) {
    try { localStorage.setItem("hd-token", m[1]); } catch (e) {}
    history.replaceState(null, "", location.pathname);
  }
})();
const token = () => { try { return localStorage.getItem("hd-token") || ""; } catch (e) { return ""; } };

const app = document.getElementById("app");
let view = { name: "home", paneId: null };
let data = null;
let online = null;
let output = "";
let timer = 0;

function el(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === "class") e.className = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? "" : v);
  }
  for (const k of kids.flat(Infinity)) if (k != null && k !== false) e.append(k instanceof Node ? k : document.createTextNode(String(k)));
  return e;
}

let toastTimer = 0;
function toast(msg) {
  document.querySelector(".toast")?.remove();
  const t = el("div", { class: "toast", role: "status" }, msg);
  document.body.append(t);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.remove(), 3200);
}

async function call(method, params) {
  const r = await fetch("/api", {
    method: "POST",
    headers: { "content-type": "application/json", "x-herdr-token": token() },
    body: JSON.stringify({ method, params: params || {} }),
  });
  if (r.status === 401) {
    try { localStorage.removeItem("hd-token"); } catch (e) {}
    throw Object.assign(new Error("unpaired"), { unpaired: true });
  }
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}

// The guards: a dangerous command is shown in full and needs a second tap.
function confirmSheet(c) {
  return new Promise((resolve) => {
    const close = (v) => { s.remove(); resolve(v); };
    const s = el("div", { class: "sheet", onclick: (e) => e.target === s && close(false) },
      el("div", { class: "box" },
        el("h2", {}, "Commande à vérifier"),
        el("p", {}, c.why),
        el("div", { class: "detail" }, c.command),
        el("div", { class: "actions", style: "margin-top:14px" },
          el("button", { class: "btn", onclick: () => close(false) }, "Annuler"),
          el("button", { class: "btn danger", onclick: () => close(true) }, "Confirmer quand même"))));
    document.body.append(s);
  });
}

async function act(method, params) {
  try {
    let r = await call(method, params);
    if (r.confirm) {
      if (!(await confirmSheet(r.confirm))) return false;
      r = await call(method, { ...params, confirmed: true, command: r.confirm.command });
      if (r.confirm) { toast("La commande a changé entre-temps : vérifie à nouveau"); return false; }
    }
    if (r.error) { toast(r.error); return false; }
    return true;
  } catch (e) {
    if (e.unpaired) render();
    else toast("Pas de réponse du Mac : " + e.message);
    return false;
  }
}

const STATUS = { blocked: "BLOQUÉ", working: "EN COURS", done: "TERMINÉ", idle: "INACTIF", unknown: "—" };
const agents = () => (data ? data.workspaces.flatMap((w) => w.agents) : []);
const agentById = (id) => agents().find((a) => a.paneId === id);
function ago(t) {
  if (!t) return "";
  const m = Math.round((Date.now() - t) / 60000);
  return m < 1 ? "à l’instant" : m < 60 ? `il y a ${m} min` : `il y a ${Math.round(m / 60)} h`;
}

function badge(a) {
  if (a.status !== "blocked" && a.question) return el("span", { class: "badge b-question" }, "QUESTION");
  return el("span", { class: "badge b-" + a.status }, STATUS[a.status] || a.status);
}

function open(id) {
  view = { name: "agent", paneId: id };
  output = "";
  render();
  refresh();
}

function cardFor(a) {
  const cls = "card " + (a.status === "blocked" ? "blocked" : a.question ? "question" : "");
  return el("button", { class: cls, onclick: () => open(a.paneId) },
    el("div", { class: "row" }, el("span", { class: "name" }, `${a.workspace} · ${a.tab}`), badge(a)),
    el("div", { class: "sub" }, `${a.name} · ${ago(a.since)}`),
    a.status === "blocked" && a.menu ? el("div", { class: "q" }, a.menu.question || "Attend une décision") : null,
    a.status !== "blocked" && a.question ? el("div", { class: "q" }, a.question) : null);
}

function home() {
  const att = data.attention.map(agentById).filter(Boolean);
  return [
    el("header", { class: "top" }, el("h1", {}, "Heidrun"), el("span", { class: "conn " + (online ? "ok" : online === false ? "bad" : "") })),
    el("main", {},
      data.quotas.length ? el("div", { class: "quota" }, data.quotas.map((q) => el("span", {}, `${q.name} ${q.percent} %`))) : null,
      el("div", { class: "eyebrow" }, "À traiter"),
      att.length ? att.map(cardFor) : el("div", { class: "empty" }, "Rien n’attend ta décision."),
      data.workspaces.map((w) => [
        el("div", { class: "eyebrow" }, w.label),
        el("div", { class: "list" }, w.agents.map((a) =>
          el("button", { class: "card", onclick: () => open(a.paneId) },
            el("div", { class: "row" }, el("span", { class: "dot " + a.status }), el("span", { class: "name" }, `${a.tab} · ${a.name}`),
              a.context != null ? el("span", { class: "badge" }, `${a.context} %`) : null)))),
      ]))];
}

function agentView() {
  const a = agentById(view.paneId);
  if (!a) return [el("header", { class: "top" }, el("button", { class: "back", onclick: back }, "‹ Retour"), el("h1", {}, "Agent")), el("main", {}, el("div", { class: "empty" }, "Cet agent n’existe plus."))];
  const pre = el("pre", { class: "out" }, output || "…");
  setTimeout(() => (pre.scrollTop = pre.scrollHeight), 0);
  const ta = el("textarea", { placeholder: `Consigne pour ${a.name}…`, rows: "1", enterkeyhint: "send" });
  const send = async () => {
    const text = ta.value.trim();
    if (!text) return;
    if (await act("prompt", { paneId: a.paneId, text })) { ta.value = ""; ta.blur(); toast("Consigne envoyée"); setTimeout(refresh, 800); }
  };
  return [
    el("header", { class: "top" }, el("button", { class: "back", onclick: back }, "‹"), el("h1", {}, `${a.workspace} · ${a.tab}`), badge(a)),
    el("main", {},
      el("div", { class: "sub" }, `${a.name}${a.context != null ? ` · contexte ${a.context} %` : ""} · ${ago(a.since)}`),
      a.status === "blocked" && a.menu ? el("div", { class: "menu" },
        a.menu.question ? el("div", { class: "q" }, a.menu.question) : null,
        a.menu.detail ? el("div", { class: "detail" }, a.menu.detail) : null,
        a.menu.options.map((o) => el("button", {
          class: "opt " + (/^(yes|oui|allow|autoriser)/i.test(o.label) ? "yes" : /^(no|non|deny|refuser)/i.test(o.label) ? "no" : ""),
          onclick: async () => { if (await act("answer", { paneId: a.paneId, n: o.n })) { toast("Réponse envoyée"); setTimeout(refresh, 900); } },
        }, el("span", { class: "n" }, o.n + "."), el("span", {}, o.label)))) : null,
      a.status === "blocked" && !a.menu ? el("div", { class: "q" }, "Attend une décision : lis la fin de la sortie ci-dessous.") : null,
      a.status !== "blocked" && a.question ? el("div", { class: "q" }, a.question) : null,
      pre,
      el("div", { class: "actions" },
        el("button", { class: "btn", onclick: refresh }, "↻ Rafraîchir"),
        a.status === "blocked" ? el("button", { class: "btn danger", onclick: async () => { if (await act("keys", { paneId: a.paneId, action: "deny" })) toast("Refusé (Échap)"); } }, "Refuser") : null,
        a.status === "working" ? el("button", { class: "btn danger", onclick: async () => { if (await act("keys", { paneId: a.paneId, action: "interrupt" })) toast("Interrompu (Échap)"); } }, "Interrompre") : null)),
    el("div", { class: "composer" }, ta, el("button", { class: "btn primary", onclick: send }, "Envoyer")),
  ];
}

function back() { view = { name: "home", paneId: null }; render(); refresh(); }

function render() {
  // Keep what is being typed across refreshes.
  const typing = document.activeElement && document.activeElement.tagName === "TEXTAREA" ? document.activeElement : null;
  if (typing && view.name === "agent") return;
  app.replaceChildren();
  if (!token()) {
    app.append(el("div", { class: "pairing" }, el("h2", {}, "Appairage nécessaire"),
      el("p", {}, "Dans Heidrun sur le Mac, ouvre « Accès mobile » et scanne le QR code avec l’appareil photo."),
      el("p", {}, "Tailscale doit être connecté sur cet appareil.")));
    return;
  }
  if (!data) { app.append(el("div", { class: "pairing" }, online === false ? "Le Mac ne répond pas. Tailscale est-il connecté ? Heidrun est-il ouvert ?" : "Connexion…")); return; }
  app.append(...(view.name === "agent" ? agentView() : home()));
}

async function refresh() {
  clearTimeout(timer);
  if (!token()) return render();
  try {
    data = await call("state");
    online = true;
    if (view.name === "agent" && agentById(view.paneId)) {
      const r = await call("read", { paneId: view.paneId, lines: 80 });
      if (r.text != null) output = r.text.replace(/\s+$/, "");
    }
  } catch (e) {
    online = false;
    if (e.unpaired) data = null;
  }
  render();
  if (!document.hidden) timer = setTimeout(refresh, view.name === "agent" ? 2500 : 4000);
}

document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });
refresh();
</script>
</body>
</html>
