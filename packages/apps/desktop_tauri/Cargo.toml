[package]
name = "heidrun"
version = "0.2.5"
description = "Interface graphique pour Herdr"
license = "MIT"
edition = "2021"

[lib]
name = "heidrun_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-notification = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["net", "io-util", "time", "sync", "process", "macros"] }
# Runs the coding agent tools (codex, claude): the package of the repository that the change log generator uses too
raw_coding_agent_cli = { path = "../../auxiliary/raw_coding_agent_cli" }
portable-pty = "0.9"
base64 = "0.22"
dirs = "6"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
# Mobile access (iPhone / iPad over Tailscale)
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
if-addrs = "0.15"
# Deleting from the file explorer goes to the macOS Trash
trash = "5"
tauri-plugin-dialog = "2"
# The position and the size of the window come back at the next start
tauri-plugin-window-state = "2"
# Skills: the search on skills.sh and the download from GitHub
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# The file .env of the developer: its variables go into the environment, in a development build only
dotenvy = "0.15"
