[package]
name = "data_layer_operation_log"
version = "0.2.7"
description = "Records the operations that the data layer packages receive: a start event and a completion event for each one"
license = "MIT"
edition = "2021"
publish = false

[lib]
name = "data_layer_operation_log"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
# The feature "preserve_order" keeps the fields of a parameter object in the order in which the package wrote them
serde_json = { version = "1", features = ["preserve_order"] }
dirs = "6"
# Tells whether the process of an unfinished operation still runs
libc = "0.2"
