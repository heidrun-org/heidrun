[package]
name = "data_layer_coding_agents"
version = "0.3.0"
description = "Reads the chat sessions of Claude Code and Codex for a repository into a SQLite file, and runs read-only queries on them"
license = "MIT"
edition = "2021"
publish = false

[lib]
name = "data_layer_coding_agents"
path = "src/lib.rs"

[[bin]]
name = "data_layer_coding_agents"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
# The feature "preserve_order" keeps the columns of a row of a query in the order of the SQL statement
serde_json = { version = "1", features = ["preserve_order"] }
# The SQLite file. The feature "bundled" compiles SQLite with the package, so the JSON functions are always there.
rusqlite = { version = "0.40", features = ["bundled"] }
# Checks a chat session against its JSON schema
jsonschema = { version = "0.58", default-features = false }
dirs = "6"
# The dates of the records of a chat session file
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
# Codex compresses the files of its old chat sessions with zstd, in files that end with `.jsonl.zst`
zstd = "0.14"
# The time zones of the IANA database, for the usage of each day of a time zone, with the changes of the clock
chrono-tz = "0.10"
# The name of the time zone of the computer
iana-time-zone = "0.1"
# Fetches the public price list of the models, with a blocking call
ureq = { version = "3", default-features = false, features = ["rustls"] }
# Records the start and the end of each public function in the log of the operations of the data layer
data_layer_operation_log = { path = "../data_layer_operation_log" }
