[package]
name = "data_layer_chat_sessions"
version = "0.2.7"
description = "Reads the chat sessions of Claude Code and Codex for a repository into a SQLite file, and runs read-only queries on them"
license = "MIT"
edition = "2021"
publish = false

[lib]
name = "data_layer_chat_sessions"
path = "src/lib.rs"

[[bin]]
name = "data_layer_chat_sessions"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
# The feature "preserve_order" keeps the columns of a row of a query in the order of the SQL statement
serde_json = { version = "1", features = ["preserve_order"] }
# The SQLite file. The feature "bundled" compiles SQLite with the package, so the JSON functions are always there.
rusqlite = { version = "0.40", features = ["bundled"] }
# Checks a chat session against its JSON schema
jsonschema = { version = "0.58", default-features = false }
dirs = "6"
# The dates of the records of a chat session file
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
