[package]
name = "heidrun_data"
version = "0.3.0"
description = "One command line that reads and queries the four data layers of Heidrun, for a coding agent"
license = "MIT"
edition = "2021"
publish = false

[lib]
name = "heidrun_data"
path = "src/lib.rs"

[[bin]]
name = "heidrun_data"
path = "src/main.rs"

[dependencies]
# The four data layer libraries. This package is the only one that imports more than one of them.
data_layer_coding_agents = { path = "../data_layer_coding_agents" }
data_layer_code_hosting = { path = "../data_layer_code_hosting" }
data_layer_source_control = { path = "../data_layer_source_control" }
data_layer_user_activity = { path = "../data_layer_user_activity" }
# The feature "preserve_order" keeps the columns of a row of a query in the order of the SQL statement
serde_json = { version = "1", features = ["preserve_order"] }
# The SQLite file, open read only for the commands query and sources. The feature "bundled" compiles SQLite with the package.
rusqlite = { version = "0.40", features = ["bundled"] }
dirs = "6"
# Records the start and the end of each operation of this package, and reads the log of the operations of the data layer
data_layer_operation_log = { path = "../data_layer_operation_log" }

[dev-dependencies]
# Writes a compressed chat session file of Codex in the tests
zstd = "0.14"
