[package]
name = "data_layer_code_hosting"
version = "0.3.0"
description = "Reads the issues and the pull requests of a GitHub repository into a SQLite file, and runs read-only queries on them"
license = "MIT"
edition = "2021"
publish = false

[lib]
name = "data_layer_code_hosting"
path = "src/lib.rs"

[[bin]]
name = "data_layer_code_hosting"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
# The feature "preserve_order" keeps the columns of a row of a query in the order of the SQL statement
serde_json = { version = "1", features = ["preserve_order"] }
# The SQLite file. The feature "bundled" compiles SQLite with the package, so the JSON functions are always there.
rusqlite = { version = "0.40", features = ["bundled"] }
# Checks an issue and a pull request against their JSON schema
jsonschema = { version = "0.58", default-features = false }
# Turns a time with a time zone offset into a time in UTC
chrono = { version = "0.4", default-features = false, features = ["std"] }
dirs = "6"
# Records the start and the end of each public function in the log of the operations of the data layer
data_layer_operation_log = { path = "../data_layer_operation_log" }
