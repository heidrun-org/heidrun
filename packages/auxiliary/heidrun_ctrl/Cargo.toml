[package]
name = "heidrun_ctrl"
version = "0.2.7"
description = "The command line that controls the Heidrun application, for a coding agent"
license = "MIT"
edition = "2021"
publish = false

[lib]
name = "heidrun_ctrl"
path = "src/lib.rs"

[[bin]]
name = "heidrun_ctrl"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
# The feature "preserve_order" keeps the keys of the file .heidrun/config.json in their order when the command line changes it
serde_json = { version = "1", features = ["preserve_order"] }
dirs = "6"
